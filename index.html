<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subavarshini L | Portfolio</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Interactive Background Section -->
    <section class="interactive-bg-section">
        <div class="bg-container">
            <!-- Invisible or styled interactive hotspots positioned over the background image -->
            
            <!-- GitHub Hotspot -->
            <a href="https://github.com/your-username" target="_blank" class="hotspot github-spot" title="GitHub ID">
                <span class="sr-only">GitHub</span>
            </a>

            <!-- LinkedIn Hotspot -->
            <a href="https://linkedin.com/in/your-profile" target="_blank" class="hotspot linkedin-spot" title="LinkedIn ID">
                <span class="sr-only">LinkedIn</span>
            </a>

            <!-- Contact Number Hotspot -->
            <a href="tel:+919876543210" class="hotspot contact-spot" title="Contact Number">
                <span class="sr-only">Contact</span>
            </a>
        </div>
    </section>

</body>
</html>
